<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@400;500;700;900&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,400..700,0..1,0&display=swap" rel="stylesheet">
<style>
:root {
  --color-bg: #f5ead8;
  --color-text: #201e1d;
  --color-accent: #c67139;
  --color-accent-100: oklch(93% 0.035 45);
  --color-accent-200: oklch(87% 0.06 45);
  --color-accent-700: oklch(49% 0.12 38);
  --color-accent-800: oklch(40% 0.10 35);
  --color-accent-2-100: oklch(92% 0.025 120);
  --color-accent-2-800: oklch(37% 0.05 112);
  --color-neutral-100: oklch(96% 0.01 70);
  --color-neutral-200: oklch(91% 0.015 70);
  --color-neutral-300: oklch(84% 0.017 70);
  --color-neutral-600: oklch(54% 0.017 60);
  --color-neutral-700: oklch(44% 0.015 55);
  --font-body: 'Figtree', system-ui, sans-serif;
  --radius-lg: 18px;
  --shadow-sm: 0 1px 3px rgba(32, 30, 29, 0.08), 0 1px 2px rgba(32, 30, 29, 0.06);
}
body { margin: 0; background: var(--color-neutral-200); }
a { color: var(--color-accent-700); }
a:hover { color: var(--color-accent-800); }
.zm { font-family: 'Zen Maru Gothic', var(--font-body); }
.msr { font-family: 'Material Symbols Rounded'; font-weight: 400; font-style: normal; line-height: 1; display: inline-block; font-variation-settings: 'FILL' 0, 'wght' 500, 'GRAD' 0, 'opsz' 24; }
.req { font-size: 10px; font-weight: 700; color: #fff; background: var(--color-accent); padding: 2px 8px; border-radius: 999px; white-space: nowrap; }
.opt { font-size: 10px; font-weight: 700; color: var(--color-neutral-700); background: var(--color-neutral-200); padding: 2px 8px; border-radius: 999px; white-space: nowrap; }
.auto { font-size: 10px; font-weight: 700; color: var(--color-accent-2-800); background: var(--color-accent-2-100); padding: 2px 8px; border-radius: 999px; white-space: nowrap; }
.nm { font-size: 12.5px; font-weight: 700; }
.dt { font-size: 11px; font-weight: 500; color: var(--color-neutral-600); }
</style>
</helmet>

<div class="zm" style="width:720px;min-height:1180px;box-sizing:border-box;padding:30px 30px 36px;background:var(--color-bg);color:var(--color-text)">

  <div style="font-size:22px;font-weight:900;letter-spacing:0.02em">入力項目マップ｜必須と任意</div>
  <div style="font-size:12.5px;font-weight:500;color:var(--color-neutral-700);margin-top:8px;line-height:1.75">Excel入力シートは色で必須／任意を区別している（凡例：黄＝必須入力、青＝入力可能）。全セルを分類すると<b>必須は22セルだけ</b>で、残りはすべて任意。この比率がそのまま画面設計の指針になる。</div>

  <div style="display:flex;gap:10px;margin-top:18px">
    <div style="display:flex;align-items:center;gap:8px;background:#fff;border-radius:999px;padding:8px 14px;box-shadow:var(--shadow-sm)">
      <span class="req">必須</span><span class="dt">これだけで試算できる</span>
    </div>
    <div style="display:flex;align-items:center;gap:8px;background:#fff;border-radius:999px;padding:8px 14px;box-shadow:var(--shadow-sm)">
      <span class="opt">任意</span><span class="dt">精度を上げたいとき</span>
    </div>
    <div style="display:flex;align-items:center;gap:8px;background:#fff;border-radius:999px;padding:8px 14px;box-shadow:var(--shadow-sm)">
      <span class="auto">自動</span><span class="dt">既定値が入るが変更可</span>
    </div>
  </div>

  <div style="display:grid;grid-template-columns:repeat(2, minmax(0, 1fr));gap:14px;margin-top:22px">
    <sc-for list="{{ sections }}" as="sec" hint-placeholder-count="6">
      <div style="background:#fff;border-radius:var(--radius-lg);box-shadow:var(--shadow-sm);padding:16px 18px 10px">
        <div style="display:flex;align-items:center;gap:8px;padding-bottom:10px">
          <span class="msr" style="font-size:19px;color:var(--color-accent)">{{ sec.icon }}</span>
          <span style="font-size:14px;font-weight:900">{{ sec.title }}</span>
          <span class="dt" style="margin-left:auto">{{ sec.meta }}</span>
        </div>
        <sc-for list="{{ sec.items }}" as="it" hint-placeholder-count="4">
          <div style="display:flex;align-items:baseline;gap:9px;padding:9px 0;border-top:1px solid var(--color-neutral-100)">
            <span style="flex:1;min-width:0">
              <span class="nm">{{ it.name }}</span>
              <span class="dt" style="display:block;margin-top:2px">{{ it.note }}</span>
            </span>
            <span class="{{ it.cls }}">{{ it.tag }}</span>
          </div>
        </sc-for>
      </div>
    </sc-for>
  </div>

  <div style="background:#fff;border-radius:var(--radius-lg);box-shadow:var(--shadow-sm);padding:18px 20px;margin-top:16px">
    <div style="font-size:14px;font-weight:900;padding-bottom:4px">現行のアプリ設計から変えたところ</div>
    <sc-for list="{{ diffs }}" as="d" hint-placeholder-count="5">
      <div style="display:flex;align-items:baseline;gap:11px;padding:10px 0;border-top:1px solid var(--color-neutral-100)">
        <span style="font-size:11px;font-weight:900;color:var(--color-accent);width:16px;flex-shrink:0">{{ d.n }}</span>
        <span style="flex:1">
          <span style="font-size:12.5px;font-weight:700">{{ d.title }}</span>
          <span class="dt" style="display:block;margin-top:3px;line-height:1.7">{{ d.body }}</span>
        </span>
      </div>
    </sc-for>
  </div>

</div>

</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":720,"height":1180}}'>
const R = { tag: '必須', cls: 'req' };
const O = { tag: '任意', cls: 'opt' };
const A = { tag: '自動', cls: 'auto' };

class Component extends DCLogic {
  renderVals() {
    const mk = (name, kind, note) => ({ name, note, tag: kind.tag, cls: kind.cls });
    return {
      sections: [
        {
          icon: 'tune', title: '０. 基本', meta: '必須5',
          items: [
            mk('開始日', R, '当年1/1が既定。以降の「開始年」は全部ここから導出'),
            mk('終了年齢', O, '既定90歳'),
            mk('普通預金等の残高', R, '前年末時点。名称は固定'),
            mk('投資資産の残高 ×2', R, 'NISA・iDeCo枠。0でも可'),
            mk('投資資産の名称 ×2', O, '自由に変更でき、投資セクションの見出しに連動'),
          ],
        },
        {
          icon: 'group', title: '１. 家族構成', meta: '最大6人・必須2',
          items: [
            mk('家族1の氏名', R, '18歳以上'),
            mk('家族1の生年月日', R, '年齢と各種の既定年を導出する基準'),
            mk('性別・続柄・職業', O, '選択式'),
            mk('家族2〜6', O, '続柄が「子供」の人だけ教育費の対象になる'),
          ],
        },
        {
          icon: 'payments', title: '２. 給与収入等', meta: '対象者3枠・各8行',
          items: [
            mk('対象者の名称', R, '1人目のみ必須。夫／妻／その他を自由に改名'),
            mk('1行目の手取額・上昇率', R, '可処分所得で入力'),
            mk('2行目以降', O, '再雇用や退職での減額を段階で表現'),
            mk('変更年', A, '1行目は開始年、追加行は前行+5年'),
          ],
        },
        {
          icon: 'account_balance', title: '３. 年金・退職金', meta: '必須1',
          items: [
            mk('公的年金 1行目', R, '既定は世帯主65歳の年'),
            mk('退職一時金・その他一時収入', O, '一時型・3行'),
            mk('企業年金', O, '期間型・5行'),
            mk('個人年金・保険など', O, '期間型・5行'),
          ],
        },
        {
          icon: 'shopping_basket', title: '４. 支出', meta: '必須5',
          items: [
            mk('基本生活費 1行目＋物価上昇率', R, '住宅・教育・保険・自動車・その他を除いた全額'),
            mk('住宅費 1行目', R, '家賃／ローン／修繕／固定資産税の合計'),
            mk('保険料 1行目', R, ''),
            mk('教育費', O, '子供ごと7段階。段階を選ぶと年と相場が自動で入る'),
            mk('自動車・その他', O, '維持費は変更型、買い替えは周期型'),
          ],
        },
        {
          icon: 'savings', title: '５. 投資資産', meta: '資産ごと・必須2',
          items: [
            mk('想定利回り', R, '既定3％'),
            mk('税率', R, 'NISA/iDeCoは0％、投信・個別株は20％'),
            mk('積立', O, '期間型・5行'),
            mk('現金化', O, '期間型・5行。リタイア後の取り崩し'),
          ],
        },
      ],
      diffs: [
        { n: '1', title: '開始日を追加した', body: '現行設計には開始日そのものが無く2026年が固定だった。Excelでは必須で、しかも各セクションの「開始年」の既定値がここから計算されている。' },
        { n: '2', title: '行エディタを1型から4型にした', body: '変更型／一時型／期間型／周期型。期間型と周期型が無いと、企業年金・積立投資・自動車の買い替えが表現できない。' },
        { n: '3', title: '必須と任意を画面上で区別した', body: '必須は22項目だけ。バッジと進捗バーで「ここまで埋めれば試算できる」を示し、任意は折りたたむ。' },
        { n: '4', title: '資産の名称を編集可能にした', body: 'NISA・iDeCoは改名でき、投資セクションの見出しに連動する。普通預金等だけは固定。' },
        { n: '5', title: '行数の上限をグループごとに正しくした', body: '一律5行ではなく、給与8・保険料7・一時収入3など、Excelの行数に合わせた。' },
        { n: '6', title: '備考欄と家族の属性を追加した', body: '備考は多くのグループに存在する。家族は6人まで、性別・続柄・職業を選択式で持つ。' },
      ],
    };
  }
}
</script>
</body>
</html>
