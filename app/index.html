<title>ライフプラン表</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@400;500;700;900&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/*@STYLE@*/
</style>

<div id="shell">
  <header id="topbar">
    <h1 class="sr">ライフプラン表</h1>
    <button id="planbtn" onclick="A.planSheet()" aria-label="プランを切り替える・管理する" aria-haspopup="dialog"><span id="logo" aria-hidden="true"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M18.5 10.2C18 7.3 15.3 5.2 12 5.2c-3.9 0-7 2.6-7 5.8 0 1.8 1 3.4 2.5 4.4V18h2.6v-1.5c.6.1 1.2.2 1.9.2s1.3-.1 1.9-.2V18h2.6v-2.6c.8-.5 1.4-1.2 1.8-2h1.4v-3.2h-1.2z"/><path d="M10 8h3.2"/><circle cx="15.6" cy="10.2" r=".6" fill="currentColor"/><path d="M5.2 10.4c-1 .1-1.7-.4-1.9-1.2"/></svg></span><span id="planname"></span><svg class="ic" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg></button>
    <button id="privacy" onclick="A.privacy()" aria-label="データの保存について"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="10.5" width="14" height="10" rx="2.5"/><path d="M8 10.5V8a4 4 0 0 1 8 0v2.5"/></svg><span>端末内に保存</span></button>
  </header>
  <main id="scroll">
    <div id="summary" role="button" tabindex="0" aria-label="CF表を見る"><div id="sumbody"></div><div id="delta" class="delta" role="status" hidden></div></div>
    <div id="inputview">
      <nav id="tabs" aria-label="入力のセクション"></nav>
      <div id="legend"></div>
      <div id="content"></div>
    </div>
    <div id="cfview" hidden><div id="cf"></div></div>
    <div id="coverview" hidden></div>
    <div id="bookview" hidden></div>
    <div id="wizview" hidden></div>
    <div id="cmpview" hidden><div id="cmp"></div></div>
  </main>
  <nav id="tabbar" aria-label="画面の切り替え">
    <button id="seg-book" onclick="A.view('book')"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 4.5h11.5a1.5 1.5 0 0 1 1.5 1.5v14.5H8a2 2 0 0 1-2-2z"/><path d="M6 18.5a2 2 0 0 1 2-2h11M9.5 8.5h6M9.5 11.5h4"/></svg><span>家計簿</span><i class="due-dot" aria-label="今月がまだです"></i></button>
    <button id="seg-input" onclick="A.view('input')"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4.5 6h10M4.5 11h7M4.5 16h4.5"/><path d="M13.5 19.5l.7-3.2 5.6-5.6a1.6 1.6 0 0 1 2.3 2.3l-5.6 5.6z"/></svg><span>プラン</span></button>
    <button id="seg-cf" onclick="A.view('cf')"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 19.5h16"/><rect x="5.5" y="11" width="3" height="6" rx="1"/><rect x="10.5" y="7.5" width="3" height="9.5" rx="1"/><rect x="15.5" y="4.5" width="3" height="12.5" rx="1"/></svg><span>未来の表</span></button>
    <button id="seg-cmp" onclick="A.view('cmp')"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 18l4.5-5 3.5 3L19.5 7"/><path d="M4 9.5l4.5 3 4-3.5 7 4"/></svg><span>比較</span></button>
  </nav>
  <div id="sheetwrap" hidden></div>
  <div id="toast" role="status" hidden></div>
</div>

</script>
