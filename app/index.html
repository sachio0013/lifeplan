<div id="shell">
  <header id="topbar">
    <button id="planbtn" onclick="A.planSheet()" aria-label="プランを切り替える・管理する" aria-haspopup="dialog"><span id="logo" aria-hidden="true"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M18.5 10.2C18 7.3 15.3 5.2 12 5.2c-3.9 0-7 2.6-7 5.8 0 1.8 1 3.4 2.5 4.4V18h2.6v-1.5c.6.1 1.2.2 1.9.2s1.3-.1 1.9-.2V18h2.6v-2.6c.8-.5 1.4-1.2 1.8-2h1.4v-3.2h-1.2z"/><path d="M10 8h3.2"/><circle cx="15.6" cy="10.2" r=".6" fill="currentColor"/><path d="M5.2 10.4c-1 .1-1.7-.4-1.9-1.2"/></svg></span><span id="planname"></span><svg class="ic" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg></button>
    <div class="seg" role="tablist" aria-label="画面の切り替え">
      <button id="seg-input" role="tab" onclick="A.view('input')">入力</button>
      <button id="seg-cf" role="tab" onclick="A.view('cf')">CF表</button>
      <button id="seg-cmp" role="tab" onclick="A.view('cmp')">比較</button>
    </div>
  </header>
  <div id="scroll">
    <div id="summary" role="button" tabindex="0" aria-label="CF表を見る"><div id="sumbody"></div><div id="delta" class="delta" role="status" hidden></div></div>
    <div id="inputview">
      <nav id="tabs" aria-label="入力のセクション"></nav>
      <div id="legend"></div>
      <div id="content"></div>
    </div>
    <div id="cfview" hidden><div id="cf"></div></div>
    <div id="coverview" hidden></div>
    <div id="wizview" hidden></div>
    <div id="cmpview" hidden><div id="cmp"></div></div>
  </div>
  <div id="sheetwrap" hidden></div>
  <div id="toast" role="status" hidden></div>
</div>
